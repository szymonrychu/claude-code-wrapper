[tools]
python = "3.12"
uv = "latest"
regctl = "0.11.6"

[env]
_.python.venv = { path = ".venv", create = true }
UV_PYTHON_DOWNLOADS = "never"

[tasks.install]
description = "Install dependencies into the venv"
run = "uv sync"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Lint and check formatting"
run = "uv run ruff check . && uv run ruff format --check ."

[tasks.fmt]
description = "Format and autofix"
run = "uv run ruff format . && uv run ruff check --fix ."

[tasks.run]
description = "Serve locally with the example config"
run = "uv run ccw serve --config config.example.yaml"

[tasks.compose]
description = "Build and start the docker compose stack"
run = "docker compose up --build"

[tasks."compose:down"]
description = "Stop the docker compose stack"
run = "docker compose down"

[tasks."docker:build"]
description = "Build the container image"
run = "docker build -t claude-code-wrapper:local ."

[tasks.precommit]
description = "Run the pre-commit hooks over the whole tree (same as CI)"
run = "uvx pre-commit run --all-files --show-diff-on-failure"

[tasks."test:integration"]
description = "Build the image once, then run tests/integration (CCW_PORT, default 8080) and the two-container tests/integration_peers against it"
run = ["scripts/integration.sh", "CCW_SKIP_BUILD=1 scripts/integration-peers.sh"]

[tasks."test:integration:peers"]
description = "Run the two-container peer messaging tests (builds the image unless CCW_SKIP_BUILD=1)"
run = "scripts/integration-peers.sh"
