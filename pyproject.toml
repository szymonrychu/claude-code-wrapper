[project]
name = "claude-code-wrapper"
version = "0.5.0"
description = "HTTP microservice that runs long-lived interactive Claude Code sessions under a PTY"
readme = "README.md"
license = "MIT"
authors = [{ name = "Szymon Rychu", email = "szymon.rychu@gmail.com" }]
keywords = ["claude-code", "pty", "http", "sse", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "prometheus-client",
    "anyio",
]

[project.scripts]
ccw = "claude_code_wrapper.cli:main"
ccw-hook = "claude_code_wrapper.hook_relay:main"

[project.urls]
Homepage = "https://github.com/szymonrychu/claude-code-wrapper"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_wrapper"]
# config.example.yaml and examples/ live in claude_code_wrapper/data/ and ship in the wheel.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs the compose stack (mise run test:integration)"]
asyncio_mode = "auto"
