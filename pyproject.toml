[project]
name = "claude-code-wrapper"
version = "0.1.0"
description = "HTTP microservice that runs long-lived interactive Claude Code sessions under a PTY"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "prometheus-client",
]

[project.scripts]
ccw = "claude_code_wrapper.cli:main"
ccw-hook = "claude_code_wrapper.hook_relay:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_wrapper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
