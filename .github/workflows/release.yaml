name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  HARBOR_URL: harbor.szymonrichert.pl
  CONTAINER_NAME: claude-code-wrapper

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Derive version and short sha
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SHORTSHA=$(git rev-parse --short=7 ${GITHUB_SHA})" >> "$GITHUB_ENV"
      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASSWORD" | docker login "$HARBOR_URL" -u "$HARBOR_USERNAME" --password-stdin
      - name: Pull the main-built image
        run: |
          if ! docker pull $HARBOR_URL/containers/$CONTAINER_NAME:$SHORTSHA; then
            echo "::error::image $CONTAINER_NAME:$SHORTSHA not found in Harbor; the tagged commit must have passed the main pipeline first"
            exit 1
          fi
      - name: Tag and push version and latest
        run: |
          docker tag $HARBOR_URL/containers/$CONTAINER_NAME:$SHORTSHA $HARBOR_URL/containers/$CONTAINER_NAME:$VERSION
          docker tag $HARBOR_URL/containers/$CONTAINER_NAME:$SHORTSHA $HARBOR_URL/containers/$CONTAINER_NAME:latest
          docker push $HARBOR_URL/containers/$CONTAINER_NAME:$VERSION
          docker push $HARBOR_URL/containers/$CONTAINER_NAME:latest
